apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
patches:
- target:
    kind: Service
    name: tesseract-bench
  patch: |-
    - op: add
      path: /spec/template/metadata/annotations/run.googleapis.com~1network-interfaces
      value: '[{"network":"default","subnetwork":"default"}]'
    - op: add
      path: /spec/template/metadata/annotations/run.googleapis.com~1vpc-access-egress
      value: "all-traffic"
