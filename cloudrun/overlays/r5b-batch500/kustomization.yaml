apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# r5-max-ceiling with prod's --batch_max_age=500ms (r4b/r5 showed stalls at 100ms/250ms).
resources:
- ../r5-max-ceiling
patches:
- target:
    kind: Service
    name: tesseract-bench
  patch: |-
    - op: test
      path: /spec/template/spec/containers/0/args/16
      value: "--batch_max_age=250ms"
    - op: replace
      path: /spec/template/spec/containers/0/args/16
      value: "--batch_max_age=500ms"
